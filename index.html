<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#bfe6fb; --panel:#f5f9ff; --panel2:#e3eefc; --border:#1b3a5c;
    --accent:#3b8ef2; --accent2:#1f5fbf; --warn:#ffb703; --bad:#ff5d5d;
    --text:#1b3a5c; --muted:#5c7a94; --uiborder:#7a95ab; --pixel-border:#122a45;
    --panel-line:rgba(255,255,255,.65); --map-border:rgba(255,255,255,.35);
    --grass:rgba(139,222,124,.92); --grass2:rgba(120,208,108,.92); --water:rgba(107,197,247,.9);
    --road:rgba(200,192,170,.92); --house:rgba(255,158,102,.92); --farm:rgba(255,214,102,.92);
    --factory:rgba(180,186,201,.92); --park:rgba(108,214,132,.92);
    --river:rgba(74,181,247,.92); --river2:rgba(46,150,224,.92);
    --mountain:rgba(184,138,96,.92); --mountain2:rgba(153,109,70,.92); --snow:rgba(240,247,255,.95);
    --townhall:rgba(48,206,206,.92);
    --bridge:rgba(200,150,90,.92);
    --store:rgba(214,120,190,.92);
    --font-heading:'Silkscreen', monospace; --font-body:'Pixelify Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background-color:#ffffff;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz4KPHRleHQgeD0nMTAnIHk9JzM0JyBmb250LXNpemU9JzE4JyBmaWxsPSdyZ2JhKDMwLDEyMCwyNTUsMC4yNSknPiYjOTczMzs8L3RleHQ+Cjx0ZXh0IHg9JzExMCcgeT0nNjAnIGZvbnQtc2l6ZT0nMjInIGZpbGw9J3JnYmEoNDUsMTQwLDI1NSwwLjI1KSc+JiM5NzMzOzwvdGV4dD4KPHRleHQgeD0nNDAnIHk9JzEyMCcgZm9udC1zaXplPScxNScgZmlsbD0ncmdiYSgyMCw5MCwyMjAsMC4yNSknPiYjOTczMzs8L3RleHQ+Cjx0ZXh0IHg9JzEzMCcgeT0nMTQwJyBmb250LXNpemU9JzEyJyBmaWxsPSdyZ2JhKDQ1LDE0MCwyNTUsMC4yNSknPiYjOTczMzs8L3RleHQ+Cjwvc3ZnPgo=");
    background-size:160px 160px;
    background-repeat:repeat;
    animation: starDrift 16s linear infinite;
    color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    height:100vh; overflow:hidden; padding:28px;
  }
  @keyframes starDrift{
    from{ background-position:0 0; }
    to{ background-position:160px 160px; }
  }
  .gameWrap{
    display:flex; flex-direction:row; width:100%; height:100%;
    max-width:1180px; max-height:800px;
    border-radius:20px; overflow:hidden;
    box-shadow: 0 10px 28px rgba(27,58,92,.14), 0 2px 6px rgba(27,58,92,.08);
    background: linear-gradient(180deg, #7fc9f0 0%, #bfe6fb 45%, #eaf7ff 100%);
  }
  .leftCol{ flex:2 1 0; display:flex; flex-direction:column; min-width:0; overflow:hidden; order:1; }
  #statbar{
    display:flex; flex-direction:row; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;
    padding:10px 22px; background:#d7ebfa;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,.1);
    position:relative; z-index:30;
  }
  .statLeft{ display:flex; align-items:center; gap:10px; }
  .statResources{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .statRight{ display:flex; align-items:center; gap:8px; }
  .townBadge{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    background:linear-gradient(180deg,#eaf4fd,#cfe6fb);
    padding:7px 13px; border-radius:11px;
    font-family:var(--font-heading); font-weight:700; font-size:12px; color:var(--accent2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.12);
  }
  .iconBtn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px; border:none; cursor:pointer;
    background:#ffffff; font-size:16px; padding:0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.12);
    transition: transform .08s, box-shadow .08s;
  }
  .iconBtn:hover{ transform:translateY(1px) scale(1.05); }
  .stat{
    display:flex; align-items:center; gap:6px; background:#ffffff;
    padding:6px 12px; border-radius:11px; font-size:14px; font-weight:800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.12);
  }
  .stat span.val{color:var(--accent2); font-weight:800;}
  .stat.bad span.val{color:var(--bad);}
  .stat.warn span.val{color:#c8860a;}

  #buildBar{
    display:flex; gap:8px; align-items:stretch; overflow-x:auto; overflow-y:hidden;
    padding:10px 18px; background:linear-gradient(180deg, #eaf4fd, #cfe6fb);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 -2px 5px rgba(0,0,0,.08);
    flex-shrink:0;
  }
  .dock-group{ display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
  .dock-groupLabel{
    font-family:var(--font-heading); font-size:9px; font-weight:700; color:var(--accent2);
    text-transform:uppercase; letter-spacing:.05em; padding-left:2px; white-space:nowrap;
  }
  .dock-row{ display:flex; gap:6px; }
  .dock-btn{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:68px; padding:6px 4px; gap:2px; cursor:pointer; flex-shrink:0;
    background:linear-gradient(180deg, #ffffff, #eef4fa); border:2px solid transparent; border-radius:12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.04), 0 2px 3px rgba(0,0,0,.12);
    transition:transform .08s, box-shadow .08s, border-color .08s;
    font-family:var(--font-body); color:var(--text); text-align:center;
  }
  .dock-btn:hover{ transform:translateY(-2px); }
  .dock-btn.selected{ border-color:var(--accent2); background:linear-gradient(180deg,#e2f0fd,#cfe6fb); }
  .dock-btn.locked{ opacity:.55; cursor:not-allowed; }
  .dock-btn.locked:hover{ transform:none; }
  .dock-btn .dock-icon{ font-size:20px; line-height:1; }
  .dock-btn .dock-name{ font-size:10px; font-weight:700; line-height:1.15; }
  .dock-btn .dock-cost{ font-size:9px; color:var(--muted); font-weight:700; }
  .dock-btn .dock-lock{ position:absolute; top:2px; right:5px; font-size:10px; }
  .dock-btn.bulldoze.selected{ border-color:var(--bad); background:linear-gradient(180deg,#ffe3e3,#ffc9c9); }
  .dock-divider{ width:1px; align-self:stretch; background:rgba(0,0,0,.1); margin:2px 2px; flex-shrink:0; }

  .main{flex:1; display:flex; overflow:hidden;}
  .gridwrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:0; overflow:hidden; background:
      linear-gradient(180deg, #bfe6fb 0%, #e2f4fd 55%, #eef2f7 100%);
  }
  #mapStage{ margin:auto; flex-shrink:0; }

  .sidebar{
    width:20%; min-width:210px; max-width:270px; flex-shrink:0;
    background:linear-gradient(180deg, #eaf4fd, #d7ebfa);
    box-shadow: inset -1px 0 0 rgba(0,0,0,.08), 2px 0 4px rgba(0,0,0,.06);
    padding:12px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden;
    order:2;
  }
  .charPanel{
    background:#ffffff; border-radius:14px;
    padding:8px 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.06), 0 3px 4px rgba(0,0,0,.14);
    display:flex; align-items:center; gap:8px;
  }
  .charPanelHeader{
    display:flex; flex-direction:column; align-items:flex-start; gap:4px; flex:1; min-width:0;
  }
  .charPanelHeader span{
    font-family:var(--font-heading); font-weight:700; font-size:11px; color:var(--accent2);
    text-transform:uppercase; letter-spacing:.04em;
  }
  #shopBtn{
    font-family:var(--font-body); font-weight:700; font-size:11px; cursor:pointer;
    background:linear-gradient(180deg,#8fcaf9,var(--accent)); color:#fff; border:none;
    border-radius:9px; padding:5px 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.15), 0 2px 3px rgba(0,0,0,.15);
    transition:box-shadow .08s, transform .08s;
  }
  #shopBtn:hover{ transform:translateY(1px) scale(1.03); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.15); }
  .charWindow{
    width:36px; height:36px; flex-shrink:0;
    background:repeating-conic-gradient(#eaf2fa 0% 25%, #dde8f3 0% 50%) 50% / 9px 9px;
    border-radius:9px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .charWindow .placeholder-icon{ font-size:18px; }
  .charWindow .placeholder-text{ display:none; }
  .mayorRow{
    display:flex; align-items:center; gap:8px; font-family:var(--font-body);
    font-weight:700; font-size:13px; color:var(--text);
  }
  .mayorRow input{
    flex:1; min-width:0; font-family:var(--font-body); font-size:13px; font-weight:700;
    border:none; border-radius:10px; padding:6px 9px;
    background:#ffffff; color:var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.1);
  }
  .mayorRow input:focus{ outline:2px solid var(--accent); }
  .mayorQuote{
    background:#ffffff; border-radius:14px;
    padding:10px 12px; font-size:12px; line-height:1.5; color:var(--text);
    font-style:italic; position:relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.06), 0 3px 4px rgba(0,0,0,.14);
  }
  .mayorQuote::before{ content:'“'; font-size:20px; color:var(--accent2); margin-right:2px; font-style:normal; }
  .sidebarLabel{
    font-family:var(--font-heading); font-size:11px; font-weight:800; color:var(--accent2);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;
  }

  #grid{
    display:grid; gap:0;
    overflow:hidden; border-radius:14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.15), 0 6px 0 rgba(27,58,92,.25);
  }

    background-size:cover; background-position:center; background-repeat:no-repeat;
    position:relative; cursor:pointer;
    border-radius:2px;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55);
    transition:filter .1s;
  }
  .tile:nth-child(odd){background-color:var(--grass);}
  .tile.road{ background-color:#9aa0a6 !important; background-image:none !important; }

  /* ===== Game-feel additions ===== */
  .tile{ transition:filter .1s, transform .12s ease; }
  .tile:hover{ transform:translateY(-2px) scale(1.04); filter:brightness(1.08); z-index:2; }
  .tile.placed-pop{ animation:tilePop .28s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tilePop{
    0%{ transform:scale(.35); filter:brightness(1.5); }
    60%{ transform:scale(1.12); }
    100%{ transform:scale(1); filter:brightness(1); }
  }
  #floaters{ position:absolute; top:0; left:0; pointer-events:none; z-index:20; overflow:visible; }
  .floater{
    position:absolute; transform:translate(-50%, 0);
    font-family:var(--font-heading); font-weight:700; font-size:12px;
    color:#1f9e4a; text-shadow:0 1px 0 rgba(255,255,255,.85), 0 0 3px rgba(255,255,255,.6);
    pointer-events:none; white-space:nowrap;
    animation:floatUp 1.1s ease-out forwards;
  }
  .floater.bad{ color:#d64545; }
  @keyframes floatUp{
    0%{ transform:translate(-50%, 0) scale(.8); opacity:0; }
    15%{ transform:translate(-50%, -6px) scale(1.1); opacity:1; }
    100%{ transform:translate(-50%, -42px) scale(1); opacity:0; }
  }
  #levelFlash{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,220,120,.35) 45%, rgba(255,255,255,0) 75%);
    opacity:0;
  }
  #levelFlash.show{ animation:levelFlashPulse .9s ease-out; }
  @keyframes levelFlashPulse{
    0%{ opacity:0; }
    15%{ opacity:1; }
    100%{ opacity:0; }
  }
  .spark{
    position:fixed; pointer-events:none; z-index:9999; font-size:16px;
    animation:sparkFly .8s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{ transform:translate(0,0) scale(.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) scale(1.1) rotate(180deg); opacity:0; }
  }
  .stat .val.bump-up{ animation:bumpUp .5s ease-out; }
  .stat .val.bump-down{ animation:bumpDown .5s ease-out; }
  @keyframes bumpUp{
    0%{ color:#1f9e4a; transform:scale(1.35); display:inline-block; }
    100%{ color:inherit; transform:scale(1); display:inline-block; }
  }
  @keyframes bumpDown{
    0%{ color:#d64545; transform:scale(1.35); display:inline-block; }
    100%{ color:inherit; transform:scale(1); display:inline-block; }
  }
  .thLevelBar{
    width:100%; height:5px; border-radius:3px; background:rgba(27,58,92,.12);
    overflow:hidden; margin-top:3px;
  }
  .thLevelBar-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2));
    transition:width .4s ease;
  }
  .dock-new{
    position:absolute; top:-4px; right:-4px; background:var(--bad); color:#fff;
    font-family:var(--font-heading); font-size:8px; font-weight:800; letter-spacing:.03em;
    padding:2px 4px; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,.25);
    animation:newBadgePulse 1.4s ease-in-out infinite;
  }
  @keyframes newBadgePulse{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }
  .tile.swaying:not(:hover){ animation:tileSway 4.5s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes tileSway{
    0%, 100%{ transform:rotate(0deg); }
    50%{ transform:rotate(1.4deg); }
  }
  .tile.occupied:not(:hover){ animation:houseBreathe 3.2s ease-in-out infinite; }
  @keyframes houseBreathe{
    0%, 100%{ filter:brightness(1); }
    50%{ filter:brightness(1.05); }
  }
  .smoke-puff{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:rgba(110,110,120,.5); pointer-events:none;
    animation:smokeRise 2.4s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{ transform:translate(-50%,0) scale(.6); opacity:.55; }
    100%{ transform:translate(-50%,-32px) scale(1.6); opacity:0; }
  }
  #weather{
    position:absolute; top:0; left:0; pointer-events:none; z-index:15;
    overflow:hidden; transition:background .5s ease;
  }
  #weather.raining{ background:rgba(80,110,150,.08); }
  .rain-drop{
    position:absolute; width:2px; height:12px; border-radius:1px;
    background:linear-gradient(rgba(120,170,255,0), rgba(120,170,255,.65));
    animation:rainFall .65s linear forwards;
  }
  @keyframes rainFall{
    from{ transform:translateY(-10px); opacity:.85; }
    to{ transform:translateY(120px); opacity:0; }
  }
  #weather{
    position:absolute; top:0; left:0; pointer-events:none; z-index:15;
    opacity:0; background-color:rgba(40,60,90,.16);
    background-image:repeating-linear-gradient(
      100deg,
      rgba(255,255,255,.55) 0px, rgba(255,255,255,.55) 1px,
      transparent 1px, transparent 14px
    );
    background-size:60px 100%;
    transition:opacity .8s ease;
  }
  #weather.show{ opacity:1; animation:rainFall .5s linear infinite; }
  @keyframes rainFall{
    from{ background-position:0 0; }
    to{ background-position:-60px 90px; }
  }
  .resident-avatar{ animation:residentBob 2.4s ease-in-out infinite; }
  .resident-row:nth-child(2n) .resident-avatar{ animation-delay:.4s; }
  .resident-row:nth-child(3n) .resident-avatar{ animation-delay:.8s; }
  @keyframes residentBob{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  .dock-icon{ display:inline-block; animation:iconSway 3.6s ease-in-out infinite; }
  .dock-btn:nth-child(2n) .dock-icon{ animation-delay:.5s; }
  .dock-btn:nth-child(3n) .dock-icon{ animation-delay:1s; }
  @keyframes iconSway{
    0%, 100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-6deg); }
  }
  #ambientBtn{
    width:34px; height:34px; border-radius:10px; border:none; cursor:pointer;
    background:linear-gradient(180deg, #ffffff, #eef4fa); color:var(--text); font-size:15px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.04), 0 2px 3px rgba(0,0,0,.12);
  }
  #ambientBtn.on{ background:linear-gradient(180deg,#8fcaf9,var(--accent)); color:#fff; }
  #bgmBtn{

  .tile.mountain{background:var(--mountain) !important; cursor:default;}
  .tile.mountain:nth-child(odd){background:var(--mountain2) !important;}
  .tile.mountain.snow{background:var(--snow) !important;}
  .tile.mountain.snow:nth-child(odd){background:#e2e9f4 !important;}
  .tile.bridge{
    background:var(--bridge) !important;
    background-image: repeating-linear-gradient(90deg, rgba(90,60,30,.35) 0 3px, transparent 3px 14px);
  }
  .tile.store{
    background:var(--store) !important;
    background-image: linear-gradient(135deg, rgba(255,255,255,.35) 0 20%, transparent 20% 100%);
  }
  .tile:hover{ filter:brightness(1.12); }

  #tooltip{
    position:fixed; z-index:60; pointer-events:none; background:#ffffff;
    border-radius:12px; padding:10px 13px; font-size:12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.15);
    opacity:0; transition:opacity .12s; transform:translate(-50%, -120%);
    max-width:220px;
  }
  #tooltip.show{ opacity:1; }
  #tooltip .tt-title{
    font-weight:700; font-size:13px; display:flex; align-items:baseline; gap:6px;
    margin-bottom:6px; padding-bottom:6px; font-family:var(--font-heading); color:var(--text);
    border-bottom:1px solid #eef0f3;
  }
  #tooltip .tt-sub{ font-family:var(--font-body); font-size:10px; font-weight:700; color:var(--accent2); }

  #tooltip .tt-facts{ display:flex; flex-direction:column; gap:3px; }
  #tooltip .tt-fact{ color:var(--text); line-height:1.4; }

  #tooltip .tt-section{
    font-family:var(--font-body); font-size:10px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; margin:8px 0 5px;
  }
  #tooltip .tt-reqs{ display:flex; flex-direction:column; gap:4px; }
  #tooltip .tt-req{ display:flex; align-items:center; gap:6px; color:var(--muted); }
  #tooltip .tt-req.met{ color:var(--text); }
  #tooltip .tt-req-text{ flex:1; }
  #tooltip .tt-req-progress{ font-size:10px; color:var(--muted); }

  #tooltip .tt-residents{ display:flex; flex-direction:column; margin-top:6px; }
  #tooltip .tt-resident{ padding:5px 0; border-top:1px solid #eef0f3; }
  #tooltip .tt-resident:first-child{ border-top:none; padding-top:2px; }
  #tooltip .tt-resident-name{ font-weight:700; color:var(--text); }
  #tooltip .tt-resident-meta{ color:var(--muted); font-size:11px; margin-top:1px; }

  .questSectionHeader{
    display:flex; align-items:center; gap:6px;
  }
  .badge{
    display:inline-block; background:var(--bad); color:#fff; border-radius:999px;
    font-size:10px; font-weight:700; padding:2px 7px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.15);
  }
  #questPanel{
    background:#e3eefc; border-radius:12px;
    padding:8px 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.05), 0 2px 3px rgba(0,0,0,.1);
  }
  .quest-card{
    background:#ffffff; border-radius:12px; padding:9px 11px; margin-bottom:6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.05), 0 2px 3px rgba(0,0,0,.12);
  }
  .quest-card:last-child{ margin-bottom:0; }
  .quest-name{ font-size:13px; font-weight:700; margin-bottom:2px; font-family:var(--font-body); }
  .quest-need{ font-size:11px; color:var(--muted); margin-bottom:5px; }
  .quest-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .quest-timer{ font-size:10px; color:var(--muted); }
  .quest-fulfill{
    font-family:var(--font-body); font-size:11px; font-weight:700; border:none; border-radius:8px;
    padding:5px 9px; cursor:pointer; background:linear-gradient(180deg,#5fa8f5,var(--accent)); color:#fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.15), 0 2px 3px rgba(0,0,0,.15);
    transition:box-shadow .08s, transform .08s;
  }

<script>
const ROWS = 12, COLS = 17;
let TILE = 60; // kept for any legacy reference; prefer TILE_W/TILE_H below
let TILE_W = 60, TILE_H = 60;
function computeTileSize(){
  const wrap = document.querySelector('.gridwrap');
  if(!wrap) return;
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  // Force a single square tile size (1:1) no matter the wrapper's aspect ratio,
  // so the grid never stretches into rectangles on narrow/short screens.
  const size = Math.max(8, Math.floor(Math.min(availW/COLS, availH/ROWS)));
  TILE_W = size;
  TILE_H = size;
  TILE = size;
}
const STORAGE_KEY = 'pixelTownSaveV3';
const GROWTH_TICKS = 5; // 15 seconds at 3s/tick (temporary fast testing value)

// ---- Sound effects (synthesized, no audio files needed) ----
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration=0.15, type='sine', gainVal=0.12, delay=0){
  try{
    const ctx = ensureAudio();
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = gainVal;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.stop(start + duration + 0.02);
  }catch(e){}
}
const BUILD_SOUNDS = {
  road:     ()=> playTone(220, .1, 'square', .07),
  house:    ()=> { playTone(392, .12, 'sine', .1); playTone(523, .12, 'sine', .09, .09); },
  farm:     ()=> { playTone(330, .1, 'triangle', .09); playTone(440, .1, 'triangle', .07, .08); },
  factory:  ()=> { playTone(150, .18, 'sawtooth', .09); },
  park:     ()=> { playTone(660, .1, 'sine', .07); playTone(880, .12, 'sine', .06, .09); },
  townhall: ()=> { playTone(261, .14, 'sine', .09); playTone(392, .14, 'sine', .09, .12); playTone(523, .2, 'sine', .09, .24); },
  bridge:   ()=> { playTone(180, .1, 'triangle', .08); playTone(240, .12, 'triangle', .08, .07); },
};
function playBuildSound(type){ (BUILD_SOUNDS[type] || (()=>playTone(300,.1,'sine',.08)))(); }
function playBulldozeSound(){ playTone(120, .16, 'sawtooth', .1); }
function playHarvestSound(){ playTone(660, .08, 'square', .08); playTone(880, .12, 'square', .08, .07); }

// ---- External sound effects & BGM (townverse asset repo) ----
const TOWNVERSE_RES = 'https://raw.githubusercontent.com/phuongm1409/townverse/main/res/';
const SFX_FILES = {
  bubble:  'soundfx/bubble.mp3',
  click:   'soundfx/click.mp3',
  coin:    'soundfx/coin.mp3',
  event:   'soundfx/event.mp3',
  fire:    'soundfx/fire.mp3',
  fulfill: 'soundfx/fulfill.mp3',
};
const SFX_VOLUME = { bubble:.5, click:.25, coin:.5, event:.55, fire:.4, fulfill:.55 };
const sfxAudio = {};
Object.entries(SFX_FILES).forEach(([key, path])=>{
  try{
    const a = new Audio(TOWNVERSE_RES + path);
    a.preload = 'auto';
    a.volume = SFX_VOLUME[key] ?? 0.5;
    sfxAudio[key] = a;
  }catch(e){}
});
function playSfx(key){
  const base = sfxAudio[key];
  if(!base) return;
  try{
    const inst = base.cloneNode(true); // clone so overlapping plays don't cut each other off
    inst.volume = base.volume;
    inst.play().catch(()=>{});
  }catch(e){}
}

// Generic click sound: fires on any click that isn't already covered by a
// dedicated sound effect (tiles handle their own build/bulldoze/harvest
// audio, and the quest-fulfill button plays fulfill.mp3).
document.addEventListener('click', (e)=>{
  if(e.target.closest('[data-no-click-sfx]')) return;
  playSfx('click');
}, true);

// ---- Background music: loops through every track found in res/bgm ----
let bgmOn = false;
let bgmTracks = [];
let bgmIndex = 0;
let bgmPlayer = null;
function ensureBgmPlayer(){
  if(bgmPlayer) return bgmPlayer;
  bgmPlayer = new Audio();
  bgmPlayer.volume = 0.35;
  bgmPlayer.addEventListener('ended', playNextBgmTrack);
  return bgmPlayer;
}
async function loadBgmTracks(){
  if(bgmTracks.length) return bgmTracks;
  try{
    const res = await fetch('https://api.github.com/repos/phuongm1409/townverse/contents/res/bgm');
    if(!res.ok) throw new Error('bgm listing failed');
    const files = await res.json();
    bgmTracks = files
      .filter(f=> f.type === 'file' && /\.(mp3|wav|ogg)$/i.test(f.name))
      .map(f=> f.download_url);
  }catch(e){
    // fallback: assume a single conventionally-named track if the API listing fails
    bgmTracks = [TOWNVERSE_RES + 'bgm/bgm.mp3'];
  }
  return bgmTracks;
}
function playNextBgmTrack(){
  if(!bgmOn || bgmTracks.length === 0) return;
  const player = ensureBgmPlayer();
  player.src = bgmTracks[bgmIndex % bgmTracks.length];
  bgmIndex++;
  player.play().catch(()=>{});
}
async function toggleBgm(){
  bgmOn = !bgmOn;
  const btn = document.getElementById('bgmBtn');
  if(btn) btn.textContent = bgmOn ? '🎵' : '🔇';
  if(bgmOn){
    await loadBgmTracks();
    if(bgmTracks.length === 0) return;
    const player = ensureBgmPlayer();
    if(!player.src) playNextBgmTrack();
    else player.play().catch(()=>{});
  } else if(bgmPlayer){
    bgmPlayer.pause();
  }
}

// ---- Ambient background sound (wind + occasional bird chirps) ----
let ambientOn = false;
let windSource = null, chirpInterval = null;
function toggleAmbient(){
  ambientOn = !ambientOn;
  if(ambientOn) startAmbient(); else stopAmbient();
  renderStats();
}
function startAmbient(){
  try{
    const ctx = ensureAudio();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0; i<bufferSize; i++) data[i] = (Math.random()*2 - 1) * 0.3;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    const gain = ctx.createGain();
    gain.gain.value = 0.03;
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
    windSource = noise;
    chirpInterval = setInterval(()=>{
      if(!ambientOn) return;
      if(Math.random() < 0.4){
        const base = 1200 + Math.random()*800;
        playTone(base, .06, 'sine', .04);
        playTone(base*1.3, .05, 'sine', .03, .07);
      }
    }, 2200);
  }catch(e){}
}
function stopAmbient(){
  try{ if(windSource){ windSource.stop(); windSource = null; } }catch(e){}
  if(chirpInterval){ clearInterval(chirpInterval); chirpInterval = null; }
}

// ---- Weather: rain overlay ----
function startRain(durationMs){
  const weather = document.getElementById('weather');
  const grid = document.getElementById('grid');
  if(!weather || !grid) return;
  const w = COLS*TILE_W, h = ROWS*TILE_H;
  weather.style.width = w+'px';
  weather.style.height = h+'px';
  weather.classList.add('raining');
  const interval = setInterval(()=>{
    const drop = document.createElement('div');
    drop.className = 'rain-drop';
    drop.style.left = (Math.random()*w) + 'px';
    drop.style.top = '-10px';
    weather.appendChild(drop);
    setTimeout(()=> drop.remove(), 650);
  }, 60);
  setTimeout(()=>{
    clearInterval(interval);
    weather.classList.remove('raining');
  }, durationMs);
}

// ---- Road pathfinding for delivery trucks ----
function isRoadLike(t){
  return !!(t && (t.type === 'road' || t.type === 'bridge'));
}
function adjacentRoadTile(idx){
  const r = Math.floor(idx/COLS), c = idx%COLS;
  const neighbors = [];
  if(r>0) neighbors.push(idx-COLS);
  if(r<ROWS-1) neighbors.push(idx+COLS);
  if(c>0) neighbors.push(idx-1);
  if(c<COLS-1) neighbors.push(idx+1);
  return neighbors.find(n=> isRoadLike(state.tiles[n])) ?? null;
}
function bfsRoadPath(startIdx, endIdx){
  if(startIdx == null || endIdx == null) return null;
  if(!isRoadLike(state.tiles[startIdx])) return null;
  if(!isRoadLike(state.tiles[endIdx])) return null;
  if(startIdx === endIdx) return [startIdx];
  const visited = new Set([startIdx]);
  const queue = [[startIdx]];
  while(queue.length){
    const path = queue.shift();
    const cur = path[path.length-1];
    const r = Math.floor(cur/COLS), c = cur%COLS;
    const neighbors = [];
    if(r>0) neighbors.push(cur-COLS);
    if(r<ROWS-1) neighbors.push(cur+COLS);
    if(c>0) neighbors.push(cur-1);
    if(c<COLS-1) neighbors.push(cur+1);
    for(const n of neighbors){
      if(visited.has(n)) continue;
      if(!state.tiles[n] || !isRoadLike(state.tiles[n])) continue;
      const newPath = [...path, n];
      if(n === endIdx) return newPath;
      visited.add(n);
      queue.push(newPath);
    }
  }
  return null;
}

function positionTruckAt(el, idx){
  const r = Math.floor(idx/COLS), c = idx%COLS;
  el.style.left = (c*TILE_W + TILE_W/2 - 15) + 'px';

}

const FIRE_BURN_MS = 2000;
function spawnFireOverlay(i){
  const layer = document.getElementById('fires');
  if(!layer) return;
  playSfx('fire');
  const r = Math.floor(i/COLS), c = i % COLS;
  const el = document.createElement('div');
  el.className = 'fire-overlay';
  el.style.left = (c*TILE_W) + 'px';
  el.style.top = (r*TILE_H) + 'px';
  el.style.width = TILE_W + 'px';
  el.style.height = TILE_H + 'px';
  layer.appendChild(el);
  setTimeout(()=> el.remove(), FIRE_BURN_MS);
}

function triggerFireAt(i, targetTile){
  spawnFireOverlay(i);
  setTimeout(()=>{
    const cur = state.tiles[i];
    if(cur === targetTile){
      if(cur.type === 'house') state.housingCap = Math.max(4, state.housingCap - 4);
      state.tiles[i] = null;
      state.happiness = Math.max(0, state.happiness - 10);
      log(`The fire burned itself out, leaving nothing behind.`);
      renderGrid(); renderStats(); save();
    }
  }, FIRE_BURN_MS);
}

function animateTruck(path){
  const container = document.getElementById('trucks');
  if(!container || path.length === 0) return;
  const el = document.createElement('div');
  el.className = 'truck';
  positionTruckAt(el, path[0]);
  container.appendChild(el);
  let i = 1;
  function step(){
    if(i >= path.length){
      el.style.opacity = '0';
      setTimeout(()=> el.remove(), 350);
      return;
    }
    const prevIdx = path[i-1], idx = path[i];
    if((idx % COLS) < (prevIdx % COLS)) el.classList.add('flip');
    else if((idx % COLS) > (prevIdx % COLS)) el.classList.remove('flip');
    positionTruckAt(el, idx);
    i++;
    setTimeout(step, 380);
  }
  setTimeout(step, 380);
}

function trySpawnTruck(farmIdx){
  const availableDest = ['townhall', 'factory'].filter(t=> countType(t) > 0);
  if(availableDest.length === 0) return;
  const destType = availableDest[Math.floor(Math.random()*availableDest.length)];
  const destIdx = randomIndexOfType(destType);
  if(destIdx == null) return;
  const farmRoad = adjacentRoadTile(farmIdx);
  const destRoad = adjacentRoadTile(destIdx);
  if(farmRoad == null || destRoad == null) return;
  const roadPath = bfsRoadPath(farmRoad, destRoad);
  if(!roadPath) return;
  animateTruck([farmIdx, ...roadPath, destIdx]);
}

// ---- Auto-fetched building media (falls back to built-in pixel art / colors if missing) ----
const RES_BASE = 'https://raw.githubusercontent.com/phuongm1409/townverse/main/res/';
const RES_FILES = {
  road1:'road 1.png', road2:'road 2.png', road3:'road 3.png', road4:'road 4.png', roadX:'road X.png',
  house:'house.png', farm:'farm.png', factory:'factory.png', park:'park.png',
  townhall:'town hall.png', store:'store.png', bridge:'bridge.png',
};
const _resCache = {};
function resFileFor(type, variant){
  const key = variant || type;
  const file = RES_FILES[key];
  return file ? RES_BASE + encodeURIComponent(file) : null;
}
function tryResImage(url, onOk){
  if(!url) return;
  if(url in _resCache){ if(_resCache[url]) onOk(); return; }
  const img = new Image();
  img.onload = ()=>{ _resCache[url] = true; onOk(); };
  img.onerror = ()=>{ _resCache[url] = false; };
  img.src = url;
}
function applyResImage(div, url, rot){
  tryResImage(url, ()=>{
    div.style.backgroundImage = `url("${url}")`;
    div.style.backgroundSize = 'cover';
    div.style.backgroundPosition = 'center';
    if(rot){ div.style.setProperty('--res-rot', rot+'deg'); }
  });
}

function farmStageImage(fraction){
  if(fraction >= 1) return FARM_STAGE_IMAGES[2];
  if(fraction > 0.6) return FARM_STAGE_IMAGES[1];
  return FARM_STAGE_IMAGES[0];
}

function roadNeighbors(i){
  const r = Math.floor(i/COLS), c = i%COLS;
  const isRoad = (idx)=> idx>=0 && idx<state.tiles.length && isRoadLike(state.tiles[idx]);
  return {
    hasN: r>0 && isRoad(i-COLS),
    hasS: r<ROWS-1 && isRoad(i+COLS),
    hasE: c<COLS-1 && isRoad(i+1),
    hasW: c>0 && isRoad(i-1),
  };
}

function roadVariant(i){
  const { hasN, hasS, hasE, hasW } = roadNeighbors(i);
  const count = [hasN,hasS,hasE,hasW].filter(Boolean).length;
  const vert = hasN || hasS;
  const horiz = hasE || hasW;
  if(count >= 4) return { cls:'cross', rot:0, res:'road4' };
  if(count === 3){
    if(!hasN) return { cls:'corner', rot:0, res:'road3' };
    if(!hasE) return { cls:'corner', rot:90, res:'road3' };
    if(!hasS) return { cls:'corner', rot:180, res:'road3' };
    return { cls:'corner', rot:270, res:'road3' };
  }
  if(vert && horiz){
    if(hasN && hasE) return { cls:'corner', rot:0, res:'road2' };
    if(hasE && hasS) return { cls:'corner', rot:90, res:'road2' };
    if(hasS && hasW) return { cls:'corner', rot:180, res:'road2' };
    if(hasW && hasN) return { cls:'corner', rot:270, res:'road2' };
  }
  if(vert && !horiz) return { cls:'vert', rot:0, res:'road1' };
  if(horiz && !vert) return { cls:'horiz', rot:0, res:'road1' };
  return { cls:'horiz', rot:0, res:'roadX' };
}

function buildableIndices(){
  return state.tiles
    .map((t,i)=> (t && !t.terrain) ? i : -1)
    .filter(i=> i !== -1);
}
function riverAdjacentFarmIndices(){
  const out = [];
  state.tiles.forEach((t,i)=>{
    if(!t || t.type !== 'farm') return;
    const r = Math.floor(i/COLS), c = i%COLS;
    const neighbors = [[-1,0],[1,0],[0,-1],[0,1]];
    for(const [dr,dc] of neighbors){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
      const n = state.tiles[nr*COLS+nc];
      if(n && n.type==='river'){ out.push(i); break; }
    }
  });
  return out;
}
function randomIndexOfType(type){
  const idx = [];
  state.tiles.forEach((t,i)=>{ if(t && t.type===type) idx.push(i); });
  if(idx.length === 0) return null;
  return idx[Math.floor(Math.random()*idx.length)];
}
function anyBuildingIndex(){
  const idx = buildableIndices();
  if(idx.length === 0) return Math.floor(ROWS/2)*COLS + Math.floor(COLS/2);
  return idx[Math.floor(Math.random()*idx.length)];
}

function maybeTriggerEvent(){
  if(Math.random() > 0.16) return;
  const totalWeight = EVENTS.reduce((s,e)=> s+e.weight, 0);
  let roll = Math.random() * totalWeight;
  let chosen = null;
  for(const e of EVENTS){
    roll -= e.weight;
    if(roll <= 0){ chosen = e; break; }
  }
  if(!chosen) return;
  const result = chosen.run();
  if(!result) return;
  playSfx('event');
  log(`${chosen.icon} ${result.msg}`);
  renderGrid(); renderStats();
  showEventBubble(result.index, chosen.kind, chosen.icon, chosen.title, result.msg);
  if(result.floater) showFloater(result.index, result.floater, result.floaterCls);
}

function generateTerrain(tiles){
  let col = 3 + Math.floor(Math.random()*4);
  let lastDrift = 0;
  for(let r = 0; r < ROWS; r++){
    let drift = Math.floor(Math.random()*3) - 1;
    if(drift === lastDrift && Math.random() < 0.5) drift = -drift;
    col = Math.max(1, Math.min(COLS-2, col + drift));
    lastDrift = drift;
    const roll = Math.random();
    const width = roll < 0.15 ? 3 : roll < 0.4 ? 2 : 1;
    for(let w = 0; w < width; w++){
      const c = Math.min(COLS-1, col+w);
      tiles[r*COLS + c] = { type:'river', terrain:true };
    }
  }
  const fromLeft = Math.random() < 0.5;
  growMountainBlob(tiles, 0, fromLeft ? 0 : COLS-1, 11 + Math.floor(Math.random()*6));
  if(Math.random() < 0.6){
    growMountainBlob(tiles, ROWS-1, fromLeft ? COLS-1 : 0, 5 + Math.floor(Math.random()*4));
  }
  return tiles;
}

function growMountainBlob(tiles, startR, startC, size){
  const frontier = [[startR, startC]];
  const visited = new Set();
  let placed = 0;
  while(frontier.length && placed < size){
    const pick = Math.floor(Math.random()*frontier.length);
    const [r, c] = frontier.splice(pick, 1)[0];
    const key = r+','+c;
    if(visited.has(key)) continue;
    visited.add(key);
    if(r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    const idx = r*COLS + c;
    if(tiles[idx]) continue;
    const peak = 28 + Math.floor(Math.random()*30);
    tiles[idx] = { type:'mountain', terrain:true, peak, snow: peak > 46 };
    placed++;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
      if(Math.random() < 0.65) frontier.push([r+dr, c+dc]);
    });
  }
}

function makeQuest(){
  const houseIdx = randomIndexOfType('house');
  const anchor = houseIdx ?? anyBuildingIndex();
  const name = CITIZEN_NAMES[Math.floor(Math.random()*CITIZEN_NAMES.length)];

  const needPool = [
    { res:'food', amount: 10 + Math.floor(Math.random()*16) },
    { res:'wood', amount: 6 + Math.floor(Math.random()*10) },
    { res:'coins', amount: 15 + Math.floor(Math.random()*26) },
  ];
  const need = needPool[Math.floor(Math.random()*needPool.length)];

  const rewardIsHappiness = Math.random() < 0.4;
  const reward = rewardIsHappiness
    ? { type:'happiness', amount: 4 + Math.floor(Math.random()*6) }
    : { type:'coins', amount: Math.round(need.amount * 1.6) + 10 };

  const duration = 15 + Math.floor(Math.random()*11); // ticks (~45-75s at 3s/tick)

  return {
    id: state.nextQuestId++,
    name,
    tileIndex: anchor,
    need,
    reward,
    expiresAtTick: state.tick + duration,
    createdAtTick: state.tick,
    duration,
  };
}

function maybeGenerateQuest(){
  const MAX_ACTIVE = 3;
  if(state.quests.length >= MAX_ACTIVE) return;
  if(Math.random() > 0.22) return;
  const q = makeQuest();
  state.quests.push(q);
  log(`${q.name} has a request: needs ${q.need.amount} ${RES_LABEL[q.need.res]}.`);
  showEventBubble(q.tileIndex, 'good', '💬', 'New Request', `${q.name} needs ${q.need.amount} ${RES_LABEL[q.need.res]}.`);
  renderQuests();
}

function expireQuests(){
  const stillActive = [];
  let anyExpired = false;
  state.quests.forEach(q=>{
    if(state.tick >= q.expiresAtTick){
      anyExpired = true;
      state.happiness = Math.max(0, state.happiness - 2);
      log(`${q.name}'s request went unanswered and they left disappointed.`);
    } else {
      stillActive.push(q);
    }
  });
  state.quests = stillActive;
  if(anyExpired){ renderQuests(); renderStats(); }
}

function fulfillQuest(id){
  const q = state.quests.find(q=>q.id===id);
  if(!q) return;
  if(state[q.need.res] < q.need.amount){
    log(`Not enough ${q.need.res} to fulfill ${q.name}'s request.`);
    return;
  }
  playSfx('fulfill');
  state[q.need.res] -= q.need.amount;
  if(q.reward.type === 'happiness'){
    state.happiness = Math.min(100, state.happiness + q.reward.amount);
  } else {
    state[q.reward.type] += q.reward.amount;
  }
  state.quests = state.quests.filter(x=>x.id!==id);
  const rewardText = q.reward.type==='happiness' ? `+${q.reward.amount} happiness` : `+${q.reward.amount} ${RES_LABEL[q.reward.type]}`;
  log(`Fulfilled ${q.name}'s request. Reward: ${rewardText}.`);
  showEventBubble(q.tileIndex, 'good', '✅', 'Request Fulfilled', `${q.name} says thanks! ${rewardText}`);
  showFloater(q.tileIndex, `+${q.reward.amount} ${q.reward.type==='happiness'?'😊':RES_LABEL[q.reward.type].split(' ')[0]}`, 'good');
  renderQuests(); renderStats(); save();
}

function renderQuests(){
  const list = document.getElementById('questList');
  const badge = document.getElementById('questBadge');
  if(state.quests.length === 0){
    list.innerHTML = `<div class="quest-empty">No active requests right now.</div>`;

  } else {

      return `

          </div>

    }).join('');
  }
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function ghPublish(){
  const btn = document.getElementById('ghPublishBtn');
  if(!ghHasCfg()){ ghOpenPanel(); return; }
  const cfg = ghLoadCfg();
  const api = `https://api.github.com/repos/${cfg.repo}/contents/${encodeURIComponent(cfg.path).replace(/%2F/g,'/')}`;
  btn.disabled = true; const oldText = btn.textContent; btn.textContent = 'Publishing…';
  try{
    save();
    const content = utf8ToBase64(JSON.stringify(state, null, 2));
    let sha;
    try{
      const getRes = await fetch(`${api}?ref=${encodeURIComponent(cfg.branch)}`, {
        headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
      });
      if(getRes.ok){ const j = await getRes.json(); sha = j.sha; }
    }catch(e){}
    const putRes = await fetch(api, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({
        message: `Publish town save (${new Date().toISOString()})`,
        content, branch: cfg.branch, ...(sha ? {sha} : {})
      })
    });
    if(!putRes.ok){
      const err = await putRes.json().catch(()=>({}));
      throw new Error(err.message || `GitHub API error ${putRes.status}`);
    }
    btn.textContent = 'Published ✓';
  }catch(e){
    btn.textContent = 'Failed ✗';
    console.error('GitHub publish failed:', e);
  }finally{
    setTimeout(()=>{ btn.textContent = oldText; btn.disabled = false; }, 2200);
  }
}
document.getElementById('ghPublishBtn').addEventListener('click', ghPublish);
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.quests) state.quests = [];
      if(!state.nextQuestId) state.nextQuestId = 1;
      if(!state.mayorName) state.mayorName = 'Mayor';
      const wanted = ROWS*COLS;
      if(!Array.isArray(state.tiles)) state.tiles = generateTerrain(Array(wanted).fill(null));
      else if(state.tiles.length < wanted){
        // Older save from a smaller map size — keep existing tiles, fill the
        // newly added cells with plain grass instead of leaving a blank gap.
        while(state.tiles.length < wanted) state.tiles.push(null);
      } else if(state.tiles.length > wanted){
        state.tiles = state.tiles.slice(0, wanted);
      }
      return true;
    }
  }catch(e){}
  return false;
}

      const costStr = Object.entries(b.cost).map(([k,v])=>`${v}${k==='coins'?'🪙':k==='wood'?'🪵':''}`).join(' ');
      btn.innerHTML = `
        ${unlocked ? '' : `<span class="dock-lock">🔒</span>`}
        ${isNew ? `<span class="dock-new">NEW</span>` : ''}
        <span class="dock-icon">${BUILD_ICONS[key] || '🏗️'}</span>
        <span class="dock-name">${b.name}</span>
        <span class="dock-cost">${unlocked ? costStr : 'Lv.'+b.unlockLevel}</span>
      `;
      btn.title = b.desc;
      if(unlocked){
        btn.onclick = ()=>{ selectedBuild = (selectedBuild===key) ? null : key; renderBuildList(); updateGridCursor(); };
      }
      row.appendChild(btn);
    });

    group.appendChild(row);
    list.appendChild(group);
  });

  const divider = document.createElement('div');
  divider.className = 'dock-divider';
  list.appendChild(divider);

  const toolGroup = document.createElement('div');
  toolGroup.className = 'dock-group';
  const toolLabel = document.createElement('div');
  toolLabel.className = 'dock-groupLabel';
  toolLabel.textContent = 'Tool';
  toolGroup.appendChild(toolLabel);
  const toolRow = document.createElement('div');
  toolRow.className = 'dock-row';
  const bulldoze = document.createElement('div');
  bulldoze.className = 'dock-btn bulldoze' + (selectedBuild==='bulldoze' ? ' selected':'');
  bulldoze.innerHTML = `<span class="dock-icon">🔨</span><span class="dock-name">Bulldoze</span>`;
  bulldoze.title = 'Demolish a tile';
  bulldoze.onclick = ()=>{ selectedBuild = (selectedBuild==='bulldoze') ? null : 'bulldoze'; renderBuildList(); updateGridCursor(); };
  toolRow.appendChild(bulldoze);
  toolGroup.appendChild(toolRow);
  list.appendChild(toolGroup);
  updateGridCursor();
}

function celebrateLevelUp(){

const FIRST_NAMES = ['Alex','Bella','Chris','Dana','Eli','Fiona','Gus','Hana','Ivan','Jill','Kai','Lena','Milo','Nina','Omar','Priya','Quinn','Rosa','Sam','Tara'];
const LAST_NAMES = ['Smith','Nguyen','Kim','Patel','Garcia','Muller','Chen','Rossi','Silva','Tanaka','Ivanov','Dubois'];

function seededRand(seed){
  const x = Math.sin(seed * 999.7) * 10000;
  return x - Math.floor(x);
}

function houseResidents(i){
  const houseIndices = state.tiles.map((t,idx)=> (t && t.type==='house') ? idx : -1).filter(idx=>idx!==-1);
  const order = houseIndices.indexOf(i);
  if(order === -1) return { occupied:0, residents:[] };

  let before = 0;
  for(let k=0;k<order;k++) before += 4;
  const occupied = Math.max(0, Math.min(4, state.population - before));

  const jobs = jobsAvailable();
  const farmJobs = countType('farm') * 1;
  const factoryJobs = countType('factory') * 2;
  const storeJobs = countType('store') * 2;

  const residents = [];
  for(let k=0;k<occupied;k++){
    const globalIdx = before + k;
    let jobTitle = 'Unemployed';
    if(globalIdx < farmJobs) jobTitle = 'Farmer';
    else if(globalIdx < farmJobs + factoryJobs) jobTitle = 'Factory Worker';
    else if(globalIdx < farmJobs + factoryJobs + storeJobs) jobTitle = 'Shopkeeper';

    const seed = i * 37 + k * 13 + 7;
    const first = FIRST_NAMES[Math.floor(seededRand(seed) * FIRST_NAMES.length)];
    const last = LAST_NAMES[Math.floor(seededRand(seed + 1) * LAST_NAMES.length)];
    const variance = Math.floor((seededRand(seed + 2) - 0.5) * 20);
    const personalHappiness = Math.max(0, Math.min(100, Math.floor(state.happiness) + variance));

    residents.push({ name: `${first} ${last}`, job: jobTitle, happiness: personalHappiness });
  }
  return { occupied, residents };
}

function productionRate(i, type){
  const r = Math.floor(i / COLS), c = i % COLS;
  let same = 0, other = 0;
  for(let dr=-1; dr<=1; dr++){
    for(let dc=-1; dc<=1; dc++){
      if(dr === 0 && dc === 0) continue;
      const rr = r + dr, cc = c + dc;
      if(rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
      const nt = state.tiles[rr * COLS + cc];
      if(!nt || nt.terrain) continue;
      if(nt.type === type) same++;
      else other++;
    }
  }
  return Math.max(0, 100 + same * 100 - other * 100);
}

function tileInfo(t, i){
  if(!t) return { name:'Empty Land' };
  if(t.type === 'river') return { name:'River', facts:['Flowing water. Riverside farms may occasionally flood.'] };
  if(t.type === 'mountain') return { name:'Mountain', facts:['Rocky terrain — not buildable.'] };

  if(t.type === 'townhall'){
    const nextLevel = state.townHallLevel + 1;
    const reqs = LEVEL_REQS[nextLevel];
    if(!reqs) return { name:`Town Hall`, sub:`Level ${state.townHallLevel}`, facts:['Max level reached!'] };
    const stats = currentTownStats();
    const reqLines = Object.entries(reqs).map(([key, need])=>{
      const have = stats[key] ?? 0;
      return { met: have >= need, text: `${LEVEL_REQ_LABELS[key](need)}`, progress:`${have}/${need}` };
    });
    return { name:'Town Hall', sub:`Level ${state.townHallLevel}`, section:'Next upgrade', reqs:reqLines };
  }

  if(t.type === 'house'){
    const { occupied, residents } = houseResidents(i);
    return {
      name:'House',
      facts:[`+4 population capacity`, `${occupied}/4 residents`],
      residents
    };
  }

  if(t.type === 'farm'){
    const rate = productionRate(i, 'farm');
    const fraction = Math.min(1, (t.growth || 0) / GROWTH_TICKS);
    return { name:'Farm', facts:[`Growth ${Math.floor(fraction*100)}%`, `Production rate ${rate}%`, `Produces food · 1 job`] };
  }

  if(t.type === 'factory'){
    const rate = productionRate(i, 'factory');
    return { name:'Factory', facts:[`+2 jobs`, `Production rate ${rate}%`, `Produces coins`] };
  }

  const b = BUILDINGS[t.type];
  return b ? { name:b.name, facts:[b.desc] } : { name:'Unknown' };
}

function showTooltip(x, y, info){
  const tip = document.getElementById('tooltip');
  const titleEl = tip.querySelector('.tt-title');

    titleEl.innerHTML = `${info.name} <span class="tt-sub">${info.sub}</span>`;
  }

  let html = '';
  if(info.facts && info.facts.length){
    html += `<div class="tt-facts">${info.facts.map(f=>`<div class="tt-fact">${f}</div>`).join('')}</div>`;
  }
  if(info.reqs && info.reqs.length){
    html += `<div class="tt-section">${info.section}</div>`;
    html += `<div class="tt-reqs">${info.reqs.map(r=>
      `<div class="tt-req ${r.met?'met':''}"><span class="tt-req-icon">${r.met?'✅':'⬜'}</span><span class="tt-req-text">${r.text}</span><span class="tt-req-progress">${r.progress}</span></div>`
    ).join('')}</div>`;
  }
  if(info.residents && info.residents.length){
    html += `<div class="tt-residents">${info.residents.map(r=>
      `<div class="tt-resident"><div class="tt-resident-name">${r.name}</div><div class="tt-resident-meta">${r.job} · ${r.happiness}% happy</div></div>`
    ).join('')}</div>`;
  }
  tip.querySelector('.tt-body').innerHTML = html;

  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('show');
}

function openTownHallModal(i){

function handleTileClick(i){
  if(!selectedBuild){
    const current = state.tiles[i];
    if(current){
      if(current.type === 'townhall') openTownHallModal(i);
      else if(current.type === 'house') openHouseModal(i);
      else if(current.type === 'factory') openFactoryModal(i);
      else if(current.type === 'farm') openFarmModal(i);
    }
    return;
  }
  const current = state.tiles[i];

  // Bridges are the one exception: they can only be built on river tiles.
  if(selectedBuild === 'bridge'){
    if(!current || current.type !== 'river'){
      log("Bridges can only be built over rivers.");
      return;
    }
    const b = BUILDINGS.bridge;
    for(const [res, amt] of Object.entries(b.cost)){
      if(state[res] < amt){ log(`Not enough ${res} to build a bridge.`); return; }
    }
    for(const [res, amt] of Object.entries(b.cost)){ state[res] -= amt; }
    state.tiles[i] = { type:'bridge' };
    log(`Built a bridge across the river.`);
    playBuildSound('bridge');
    renderGrid(); renderStats(); save();
    popTile(i);
    return;
  }

  if(current && current.terrain){
    log("You can't build on rivers or mountains.");
    return;
  }

  if(selectedBuild === 'bulldoze'){
    if(current){
      if(current.type==='house') state.housingCap = Math.max(4, state.housingCap - 4);
      if(current.type==='bridge'){
        state.tiles[i] = { type:'river', terrain:true };
        log(`Demolished a bridge. The river flows freely again.`);
      } else {
        state.tiles[i] = null;
        log(`Demolished a ${BUILDINGS[current.type].name.toLowerCase()}.`);
      }
      playBulldozeSound();
      renderGrid(); renderStats(); save();
    }
    return;
  }

  if(current){ log("That tile is already occupied."); return; }

  if(selectedBuild === 'townhall' && state.tiles.some(t => t && t.type === 'townhall')){
    log("Only one Town Hall is allowed per map.");
    return;
  }

  const b = BUILDINGS[selectedBuild];
  for(const [res, amt] of Object.entries(b.cost)){
    if(state[res] < amt){ log(`Not enough ${res} to build a ${b.name.toLowerCase()}.`); return; }
  }
  for(const [res, amt] of Object.entries(b.cost)){ state[res] -= amt; }
  state.tiles[i] = { type: selectedBuild };
  if(selectedBuild === 'park') state.tiles[i].variant = Math.random() < 0.5 ? 'p1' : 'p2';
  if(selectedBuild === 'house') state.housingCap += 4;
  if(selectedBuild === 'farm') state.tiles[i].growth = 0;
  log(`Built a ${b.name.toLowerCase()}.`);
  playBuildSound(selectedBuild);
  renderGrid(); renderStats(); save();
  popTile(i);
}

function gameTick(){
  state.tick++;
  const jobs = jobsAvailable();
  const farms = countType('farm');
  const factories = countType('factory');
  const parks = countType('park');
  const townhalls = countType('townhall');
  const stores = countType('store');
  const employed = Math.min(jobs, state.population);
  const unemployed = Math.max(0, state.population - jobs);

  const foodProduced = farms * 3;
  const foodConsumed = state.population * 1;
  state.food += foodProduced - foodConsumed;
  const starving = state.food < 0;
  if(state.food < 0) state.food = 0;

  const factoryWorkers = Math.min(employed, factories*2);
  const coinsProduced = factoryWorkers * 2;
  const upkeep = countType('house') * 0.5 + factories * 0.5;
  state.coins += coinsProduced - upkeep;
  if(state.coins < 0) state.coins = 0;
  state.wood += 0.5;

  let happinessDelta = 0;
  happinessDelta += parks * 1.5;
  happinessDelta += townhalls * 2;
  happinessDelta += stores * 1;
  happinessDelta -= unemployed * 2;
  happinessDelta -= starving ? 8 : 0;
  happinessDelta += (state.food > state.population * 5) ? 1 : 0;
  happinessDelta -= 0.3;
  state.happiness = Math.max(0, Math.min(100, state.happiness + happinessDelta));

  if(state.happiness > 60 && state.food > state.population && state.population < state.housingCap){
    if(Math.random() < 0.35){ state.population++; log("A new citizen has moved in!"); }
  } else if(state.happiness < 20 && state.population > 1){
    if(Math.random() < 0.25){ state.population--; log("A citizen left the town, unhappy."); }
  }

  // farm growth cycle: white -> brown -> green, harvest for coins + delivery truck
  state.tiles.forEach((t, i)=>{
    if(!t || t.type !== 'farm') return;
    if(t.growth == null) t.growth = 0;
    t.growth++;
    if(t.growth >= GROWTH_TICKS){
      state.coins += 50;
      playHarvestSound();
      log(`A crop was harvested! +50 coins.`);
      showFloater(i, '+50 🪙', 'good');
      trySpawnTruck(i);
      t.growth = 0;
    }
  });

  // idle smoke puffs from active factories
  state.tiles.forEach((t, i)=>{
    if(t && t.type === 'factory' && Math.random() < 0.5) spawnSmoke(i);
  });

  renderStats();
  renderGrid();
  save();
  maybeTriggerEvent();
  expireQuests();
  maybeGenerateQuest();
  save();
}

const loaded = load();
if(!state.townHallLevel) state.townHallLevel = 1;
mayorInput.value = state.mayorName || 'Mayor';
renderBuildList();
computeTileSize();
renderGrid();
renderStats();
renderQuests();
log(loaded ? "Welcome back! Your town has been restored." : "New town founded. Start building!");
setInterval(gameTick, 3000);

let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    computeTileSize();
    renderGrid();
  }, 120);
});

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{
    computeTileSize();
    renderGrid();
  });
}

// Robustly re-fit the map to its container any time the container's
// actual rendered size settles (font swaps, layout shifts, resizes, etc.)
const gridwrapEl = document.querySelector('.gridwrap');
if(gridwrapEl && window.ResizeObserver){
  let lastW = 0, lastH = 0, roTimer;
  const ro = new ResizeObserver((entries)=>{
    const box = entries[0].contentRect;
    const w = Math.round(box.width), h = Math.round(box.height);
    if(w === lastW && h === lastH) return;
    lastW = w; lastH = h;
    clearTimeout(roTimer);
    roTimer = setTimeout(()=>{
      computeTileSize();
      renderGrid();
    }, 60);
  });
  ro.observe(gridwrapEl);
} else {
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      computeTileSize();
      renderGrid();
    });
  });
}

</script>

</body>
</html>
